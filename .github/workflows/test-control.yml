name: test-control

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: firedrakeproject/firedrake-vanilla-default:2025.4.2
      options: --user root
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: 'control'
      - name: Run tests
        run: |
          cd control
          python3 -m pytest -v test -n 4 --timeout=300 --timeout-method=thread -m "not large"
          python3 -m pytest -v test --timeout=600 --timeout-method=thread -m large
